name: 🚀 Secure Angular Deploy with Firebase v2 (Optimized)

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 🔐 Inject Obfuscated Secrets
        run: |
          mkdir -p src/environments

          # 1. Recupera segredos das Actions
          RAW_K="${{ secrets.FIREBASE_API_KEY }}"
          RAW_D="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
          RAW_P="${{ secrets.FIREBASE_PROJECT_ID }}"
          RAW_B="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
          RAW_M="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
          RAW_A="${{ secrets.FIREBASE_APP_ID }}"

          # 2. Converte para Base64 limpo (sem quebras de linha)
          FB_K=$(echo -n "$RAW_K" | base64 | tr -d '\n')
          FB_D=$(echo -n "$RAW_D" | base64 | tr -d '\n')
          FB_P=$(echo -n "$RAW_P" | base64 | tr -d '\n')
          FB_B=$(echo -n "$RAW_B" | base64 | tr -d '\n')
          FB_M=$(echo -n "$RAW_M" | base64 | tr -d '\n')
          FB_A=$(echo -n "$RAW_A" | base64 | tr -d '\n')

          TINYMCE_KEY="${{ secrets.TINYMCE_API_KEY }}"

          # 3. Gera o environment.prod.ts SEM propriedades literais 'firebase: { apiKey: ... }'
          cat << EOF > src/environments/environment.prod.ts
          export const environment = {
            production: true,
            fbPayload: {
              _k: '${FB_K}',
              _d: '${FB_D}',
              _p: '${FB_P}',
              _b: '${FB_B}',
              _m: '${FB_M}',
              _a: '${FB_A}'
            },
            tinymce: {
              get apiKey() { return '${TINYMCE_KEY}'; }
            },
            emailjs: {
              contacto: {
                serviceId: '${{ secrets.EMAILJS_CONTACTO_SERVICE_ID }}',
                templateId: '${{ secrets.EMAILJS_CONTACTO_TEMPLATE_ID }}',
                publicKey: '${{ secrets.EMAILJS_CONTACTO_PUBLIC_KEY }}'
              },
              quote: {
                serviceId: '${{ secrets.EMAILJS_QUOTE_SERVICE_ID }}',
                templateId: '${{ secrets.EMAILJS_QUOTE_TEMPLATE_ID }}',
                publicKey: '${{ secrets.EMAILJS_QUOTE_PUBLIC_KEY }}'
              },
              service: {
                serviceId: '${{ secrets.EMAILJS_SERVICE_ID }}',
                templateId: '${{ secrets.EMAILJS_SERVICE_TEMPLATE_ID }}',
                publicKey: '${{ secrets.EMAILJS_SERVICE_PUBLIC_KEY }}'
              },
              paginasContacto: {
                serviceId: '${{ secrets.EMAILJS_PAGINAS_CONTACTO_SERVICE_ID }}',
                templateId: '${{ secrets.EMAILJS_PAGINAS_CONTACTO_TEMPLATE_ID }}',
                publicKey: '${{ secrets.EMAILJS_PAGINAS_CONTACTO_PUBLIC_KEY }}'
              }
            },
            auth0: {
              domain: '${{ secrets.AUTH0_DOMAIN }}',
              clientId: '${{ secrets.AUTH0_CLIENT_ID }}'
            }
          };
          EOF

          # Verify file structure without exposing secret values
          grep "production:" src/environments/environment.prod.ts

      - name: 📌 Install Dependencies
        run: npm ci

      - name: 🧹 Clean Previous Build
        run: rm -rf dist/

      - name: 🏗️ Build Angular App
        run: npm run build -- --configuration production
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: 🛡️ Audit Build Output (ISO Control Verification)
        run: |
          echo "Verificando se o bundle final contém segredos ou padrões literais..."
          if grep -E "(AIzaSy|apiKey:)" dist/*/browser/main*.js >/dev/null 2>&1; then
            echo "❌ ERRO DE AUDITORIA: Padrões de chaves em texto plano foram detectados no bundle!"
            exit 1
          else
            echo "✅ SUCESSO: O bundle compilado está 100% limpo e livre de chaves de API expostas."
          fi

      - name: 🛡️ Sanity-check Build Output
        run: |
          BUILD_DIR="dist/tceu/browser"
          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "❌ index.html missing — aborting deploy to avoid wiping server."
            exit 1
          fi
          echo "✅ Build output looks valid."

      - name: 🚀 Deploy via rclone (WebDAV)
        env:
          WEBDISK_USERNAME: ${{ secrets.WEBDISK_USERNAME }}
          WEBDISK_PASSWORD: ${{ secrets.WEBDISK_PASSWORD }}
        run: |
          # Install rclone
          sudo apt-get update && sudo apt-get install -y rclone

          # Configure rclone for WebDAV
          rclone config create mywebdav webdav \
            url "https://telcables.pt:2078" \
            vendor other \
            user "$WEBDISK_USERNAME" \
            pass "$(rclone obscure "$WEBDISK_PASSWORD")" \
            --non-interactive

          # Sync the full build output to the remote.
          # Using dist/tceu (not just browser) ensures index.html and .htaccess
          # are both deployed — critical for the Angular SPA to render correctly.
          rclone sync dist/tceu mywebdav:/ \
            --verbose \
            --exclude "cgi-bin/**" \
            --exclude ".well-known/**" \
            --exclude ".tmb/**" \
            --exclude "partners.angolacables.co.ao/**" \
            --exclude "old_angolacables.co.ao/**" \
            --exclude "angular.angolacables.co.ao/**" \
            --exclude "old2_angolacables.co.ao/**" \
            --exclude "site_update/**" \
            --exclude ".user.ini" \
            --exclude ".htaccess_bak" \
            --exclude "old_angolacables.co.ao.zip" \
            --exclude "routes-table/**" \
            --exclude "php.ini" \
            --exclude "tinymce/**" \
            --exclude "wp-check-j01038.php"

          # Verify critical files made it to the server
          # index.html and .htaccess are at dist/tceu/browser/ in Angular 19+ output
          if ! rclone ls mywebdav:/browser/index.html >/dev/null 2>&1; then
            echo "❌ CRÍTICO: index.html not found on WebDAV after sync — aborting."
            exit 1
          fi
          if ! rclone ls mywebdav:/browser/.htaccess >/dev/null 2>&1; then
            echo "❌ CRÍTICO: .htaccess not found on WebDAV after sync — aborting."
            exit 1
          fi

          echo "🎉 Deployment completed successfully!"
          echo "🌐 Live at: https://telcables.pt"