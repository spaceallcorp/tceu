name: 🚀 Secure Angular Deploy with Firebase v2 (Optimized)

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 🔐 Inject Firebase Secrets
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            firebase: {
              apiKey: '${{ secrets.FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ secrets.FIREBASE_APP_ID }}'
            }
          };
          EOF

          # Verify file structure without exposing secret values
          grep "production:" src/environments/environment.prod.ts

      - name: 📌 Install Dependencies
        run: npm ci

      - name: 🧹 Clean Previous Build
        run: rm -rf dist/

      - name: 🏗️ Build Angular App
        run: npm run build -- --configuration production
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: 🐛 Verify Build Output
        run: |
          echo "Build directory contents:"
          ls -la dist/tceu/browser
          echo "Checking for Firebase config in main bundle:"
          grep -o "apiKey" dist/tceu/browser/main*.js || echo "No API key found in build"

      - name: 🛡️ Sanity-check Build Output
        run: |
          BUILD_DIR="dist/tceu/browser"
          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "❌ index.html missing — aborting deploy to avoid wiping server."
            exit 1
          fi
          echo "✅ Build output looks valid."

      - name: 🚀 Parallel Delta Deploy via WebDAV (lftp)
        env:
          WEBDISK_USERNAME: ${{ secrets.WEBDISK_USERNAME }}
          WEBDISK_PASSWORD: ${{ secrets.WEBDISK_PASSWORD }}
        run: |
          # Install lftp for multi-threaded differential deployment
          sudo apt-get update && sudo apt-get install -y lftp

          BUILD_DIR="dist/tceu/browser"
          WEBDISK_HOST="telcables.pt"
          WEBDISK_PORT="2078"

          lftp -c "
            set ssl:verify-certificate false;
            set mirror:parallel-transfer-count 8;

            open -u $WEBDISK_USERNAME,$WEBDISK_PASSWORD https://$WEBDISK_HOST:$WEBDISK_PORT;

            mirror --reverse \
                   --delete \
                   --parallel=8 \
                   --verbose \
                   --no-perms \
                   --no-umask \
                   --exclude-glob cgi-bin/ \
                   --exclude-glob .well-known/ \
                   --exclude-glob .tmb/ \
                   --exclude-glob partners.angolacables.co.ao/ \
                   --exclude-glob old_angolacables.co.ao/ \
                   --exclude-glob angular.angolacables.co.ao/ \
                   --exclude-glob old2_angolacables.co.ao/ \
                   --exclude-glob site_update/ \
                   --exclude-glob .user.ini \
                   --exclude-glob .htaccess_bak \
                   --exclude-glob old_angolacables.co.ao.zip \
                   --exclude-glob routes-table/ \
                   $BUILD_DIR /;
          "

          echo "🎉 Deployment completed successfully!"
          echo "🌐 Live at: https://telcables.pt"